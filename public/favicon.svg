<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f99d"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- road winding to the pin -->
  <path d="M-4 112 C 34 98, 40 80, 66 82 S 104 96, 132 74" fill="none" stroke="#0b3b36" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/>
  <path d="M-4 112 C 34 98, 40 80, 66 82 S 104 96, 132 74" fill="none" stroke="#fde68a" stroke-width="3" stroke-dasharray="9 8" stroke-linecap="round"/>
  <!-- map pin -->
  <path d="M64 14 C46 14 33 27 33 44 C33 64 56 80 64 98 C72 80 95 64 95 44 C95 27 82 14 64 14 Z" fill="url(#pin)" stroke="#064e3b" stroke-width="3" stroke-linejoin="round"/>
